version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-portfolio_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./apps/api/database/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql
      - ./apps/api/database/migrations/003_resume_cv_source.sql:/docker-entrypoint-initdb.d/003_resume_cv_source.sql
      - ./apps/api/database/migrations/004_resume_builder_data.sql:/docker-entrypoint-initdb.d/004_resume_builder_data.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-portfolio_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-portfolio_db}
      PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8081"
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "8086:80"
    depends_on:
      - backend

volumes:
  postgres_data:
